<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>けいさんドリル モニターの方へ</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --line: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 {
    font-size: clamp(1.05rem, 5.5vw, 1.5rem);
    white-space: nowrap;
    margin: 0 0 24px;
  }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .label { color: var(--muted); font-size: 0.9rem; margin: 0 0 4px; }
  .item a { color: var(--primary); font-size: 1.15rem; font-weight: bold; word-break: break-all; }
  .item code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 1.6rem;
    font-weight: bold;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<main>
  <h1>けいさんドリル モニターの方へ</h1>
  <div class="item">
    <p class="label">サイト</p>
    <a href="https://sansuudrill.com/" target="_blank" rel="noopener">https://sansuudrill.com/</a>
  </div>
  <div class="item">
    <p class="label">クーポンコード</p>
    <code>BCYH-7Z5U</code>
  </div>
</main>
</body>
</html>
